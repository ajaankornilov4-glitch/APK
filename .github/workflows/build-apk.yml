name: Build MotoHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -e

          ANDROID_SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_VERSION="12266719"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" \
            -o /tmp/cmdline-tools.zip

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          unzip -q /tmp/cmdline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK:"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"

      - name: Check sdkmanager
        shell: bash
        run: |
          set -e
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/MotoHub-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoHub-APK
          path: release/MotoHub-debug.apk
          if-no-files-found: error
          retention-days: 30
